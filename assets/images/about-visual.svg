<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" fill="none">
  <!-- Background Card -->
  <rect width="600" height="460" rx="20" fill="#F4EFEA"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.4" stroke="#DCD5C9" stroke-width="1" stroke-dasharray="4 4">
    <line x1="40" y1="40" x2="560" y2="40"/>
    <line x1="40" y1="120" x2="560" y2="120"/>
    <line x1="40" y1="200" x2="560" y2="200"/>
    <line x1="40" y1="280" x2="560" y2="280"/>
    <line x1="40" y1="360" x2="560" y2="360"/>
    <line x1="40" y1="420" x2="560" y2="420"/>
    
    <line x1="80" y1="40" x2="80" y2="420"/>
    <line x1="200" y1="40" x2="200" y2="420"/>
    <line x1="320" y1="40" x2="320" y2="420"/>
    <line x1="440" y1="40" x2="440" y2="420"/>
    <line x1="540" y1="40" x2="540" y2="420"/>
  </g>

  <!-- Architectural / Code Window (Center Top) -->
  <rect x="50" y="50" width="310" height="230" rx="12" fill="#FFFFFF" stroke="#E2DBD0" stroke-width="1.5" filter="drop-shadow(0px 8px 20px rgba(28,30,29,0.06))"/>
  
  <!-- Window Header -->
  <rect x="50" y="50" width="310" height="34" rx="12" fill="#FAF7F2"/>
  <circle cx="70" cy="67" r="4.5" fill="#C86D51"/>
  <circle cx="85" cy="67" r="4.5" fill="#E2B16B"/>
  <circle cx="100" cy="67" r="4.5" fill="#557A6B"/>
  <rect x="130" y="61" width="130" height="12" rx="4" fill="#EDE7DD"/>
  
  <!-- Code lines representation -->
  <rect x="75" y="105" width="85" height="8" rx="3" fill="#1E3A34"/>
  <rect x="170" y="105" width="45" height="8" rx="3" fill="#C86D51"/>
  <rect x="90" y="125" width="120" height="7" rx="3" fill="#88918B"/>
  <rect x="90" y="143" width="150" height="7" rx="3" fill="#88918B"/>
  <rect x="110" y="161" width="90" height="7" rx="3" fill="#557A6B"/>
  <rect x="90" y="179" width="130" height="7" rx="3" fill="#88918B"/>
  <rect x="75" y="199" width="55" height="7" rx="3" fill="#C86D51"/>
  <rect x="90" y="217" width="180" height="7" rx="3" fill="#557A6B"/>
  <rect x="75" y="237" width="70" height="8" rx="3" fill="#1E3A34"/>

  <!-- UI Wireframe / Design System Card (Right Offset) -->
  <rect x="380" y="70" width="170" height="240" rx="12" fill="#FFFFFF" stroke="#E2DBD0" stroke-width="1.5" filter="drop-shadow(0px 10px 24px rgba(28,30,29,0.07))"/>
  
  <!-- Mini UI Components in Card -->
  <rect x="396" y="86" width="138" height="20" rx="5" fill="#FAF7F2"/>
  <circle cx="410" cy="96" r="5" fill="#1E3A34"/>
  <rect x="424" y="93" width="70" height="6" rx="2" fill="#C5BCAD"/>
  
  <!-- Wireframe Image block -->
  <rect x="396" y="116" width="138" height="60" rx="6" fill="#F0EBE1"/>
  <path d="M430 156 L450 136 L475 156 L510 126 L524 140" stroke="#C5BCAD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="430" cy="132" r="5" fill="#C86D51" opacity="0.8"/>
  
  <!-- UI Buttons / Sliders -->
  <rect x="396" y="188" width="60" height="18" rx="5" fill="#1E3A34"/>
  <rect x="464" y="188" width="70" height="18" rx="5" fill="#FAF7F2" stroke="#E2DBD0"/>
  <rect x="396" y="218" width="138" height="8" rx="4" fill="#E8E2D5"/>
  <rect x="396" y="218" width="85" height="8" rx="4" fill="#C86D51"/>
  <circle cx="481" cy="222" r="7" fill="#FFFFFF" stroke="#C86D51" stroke-width="2.5"/>

  <!-- Metrics / Innovation Card (Bottom Center) -->
  <rect x="120" y="300" width="370" height="120" rx="14" fill="#FFFFFF" stroke="#E2DBD0" stroke-width="1.5" filter="drop-shadow(0px 12px 28px rgba(28,30,29,0.08))"/>
  
  <!-- Stats Grid -->
  <g transform="translate(145, 325)">
    <circle cx="20" cy="20" r="16" fill="#EBF2EE"/>
    <path d="M14 20 L18 24 L26 16" stroke="#1E3A34" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#1C1E1D">B.Tech CSE • 9.62 CGPA</text>
    <text x="48" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#717A75">Sharanbasava University (2024–2028)</text>
  </g>

  <g transform="translate(145, 375)">
    <circle cx="20" cy="18" r="16" fill="#FDF2EE"/>
    <path d="M14 18 L20 12 L26 18 M20 13 V24" stroke="#C86D51" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#1C1E1D">Full-Stack Web &amp; UI/UX Focus</text>
    <text x="48" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#717A75">Bug Hunt 1st Prize • AI House 3rd Place</text>
  </g>

  <!-- Decorative Connection Lines / Badges -->
  <circle cx="360" cy="200" r="16" fill="#C86D51" filter="drop-shadow(0px 4px 10px rgba(200,109,81,0.3))"/>
  <path d="M354 200 L366 200 M360 194 L360 206" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
</svg>

